name: Cloudflare Pages — manual release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify the two-change gate, or deploy after it passes
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - deploy

permissions:
  contents: read

concurrency:
  group: advocatedadco-pages-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'AdvocateDadCO/advocatedadco.org'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SITE: ${{ runner.temp }}/advocatedadco-site
      RELEASE_TOOLS: ${{ runner.temp }}/advocatedadco-tools
      RELEASE_EVIDENCE: ${{ runner.temp }}/advocatedadco-evidence
    steps:
      - name: Check out the requested main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage only the reviewed site files
        run: node .github/deploy/pages-release.cjs prepare
      - name: Install the known Pages uploader outside the site
        run: npm install --prefix "$RELEASE_TOOLS" --no-save --package-lock=false wrangler@3.114.17 blake3-wasm@2.1.5
      - name: Enforce the two-change production gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/deploy/pages-release.cjs preflight
      - name: Deploy an isolated preview
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          "$RELEASE_TOOLS/node_modules/.bin/wrangler" pages deploy "$RELEASE_SITE" --project-name advocatedadco --branch "step3-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --commit-hash "$GITHUB_SHA" --commit-dirty=false --commit-message "Verify the reviewed Step 3 release"
      - name: Verify the preview manifest and policy page
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/deploy/pages-release.cjs verify-preview
      - name: Recheck production immediately before publication
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/deploy/pages-release.cjs before-production
      - name: Deploy the verified files to production
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          "$RELEASE_TOOLS/node_modules/.bin/wrangler" pages deploy "$RELEASE_SITE" --project-name advocatedadco --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false --commit-message "Step 3: policy meta-description and retired stylesheet"
      - name: Verify production and record the rollback
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/deploy/pages-release.cjs verify-production
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_EVIDENCE }}
          if-no-files-found: ignore
          retention-days: 30
